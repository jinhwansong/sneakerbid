name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit Test
        run: npm run test

      - name: E2E Test
        run: npm run test:e2e
        env:
          NODE_ENV: test
          # DB/Redis/JWT 등은 GitHub Secrets에서 주입 (DATABASE_URL, REDIS_URL, JWT_PUBLIC_KEY, JWT_PRIVATE_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, APP_NAME, FRONTEND_URL, PORT)
