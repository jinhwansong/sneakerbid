name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CI가 성공한 뒤에만 배포 (선택)
    # needs: lint-and-test  # backend-ci와 별도 workflow라 needs 불가. 필요하면 composite workflow로 변경

    steps:
      - name: Deploy to GCP VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/laceup
            git pull origin main
            cd backend
            npm ci
            npm run build
            npm prune --omit=dev
            pm2 restart laceup-api
            echo "Backend deploy done."
